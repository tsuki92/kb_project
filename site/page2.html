<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Заявки</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="navbar">
        <ul id="main_nav">
            <li><a href="index.html">Главная</a></li>
            <li><a href="page1.html">Персонал</a></li>
            <li class="active"><a href="page2.html">Заявки</a></li>
            <li class="dropdown">
                <a class="dropbtn">Роль ▼</a>
                <div class="dropdown-content">
                    <a href="#" onclick="handleLogin('HR-менеджер')">HR-менеджер</a>
                    <a href="#" onclick="handleLogin('Управляющий офисом')">Управляющий офисом</a>
                    <a href="#" onclick="handleLogin('Управляющий магазином')">Управляющий магазином</a>
                </div>
            </li>
        </ul>
    </header>
    <main class="container">
        <div class="toolbar">
            <div id="add-request-form">
                <h3>Создать новую заявку</h3>
                <input type="text" id="req-title" placeholder="Название услуги">
                <input type="text" id="req-address" placeholder="Адрес">
                <input type="text" id="req-date" placeholder="Даты">
                
                <!-- ВЫБОР СОТРУДНИКА -->
                <select id="req-staff" style="padding: 8px; margin-right: 10px;">
                    <option value="">Выберите ответственного</option>
                </select>
                
                <button onclick="submitRequest()" class="btn-action">Создать</button>
            </div>
        </div>

        <div class="card-grid" id="requests-container">
           
        </div>
    </main>
    <script src="scripts.js"></script>
</body>
</html>
